version: '3.8'

services:
  app:
    restart: always
    env_file:
      - ./business-logic/.env.production
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    restart: always

  ai-service:
    restart: always
    env_file:
      - ./artificial-intelligence-logic/.env.production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    restart: always
    environment:
      # IMPORTANT: Change these passwords in production!
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-CHANGE_THIS_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-db_forecast}
      MYSQL_USER: ${DB_USERNAME:-forecast_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-CHANGE_THIS_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-CHANGE_THIS_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Add backup service
  # backup:
  #   image: mysql:8.0
  #   depends_on:
  #     - db
  #   volumes:
  #     - ./backups:/backups
  #     - db-data:/var/lib/mysql:ro
  #   command: >
  #     bash -c "while true; do
  #       mysqldump -h db -u root -p$$MYSQL_ROOT_PASSWORD db_forecast > /backups/backup_$$(date +%Y%m%d_%H%M%S).sql;
  #       sleep 86400;
  #     done"
  #   restart: unless-stopped

logging:
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
