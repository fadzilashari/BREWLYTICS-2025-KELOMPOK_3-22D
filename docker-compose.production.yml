version: "3.8"

services:
  # 1. Laravel App (PHP-FPM)
  forecast-app:
    restart: always
    env_file:
      - ./business-logic/.env.production
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 2. AI Service (Python FastAPI)
  forecast-ai:
    restart: always
    env_file:
      - ./artificial-intelligence-logic/.env.production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
